name: Security Coding Review Agents

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    name: 5-Agent Security Review Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Agent Skills Specification Validator
        run: node scripts/spec-validator.js

      - name: Run Skill Verification Suite
        run: node tests/verify-skill.js

      - name: Run 5-Agent Security Review Suite
        run: node tests/security-audit.js

      - name: Generate Security Agent Summary
        if: success()
        run: |
          echo "## KalarisLabs Security Review Agents Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Security Agent | Scope | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|:---:|" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent 1: Path Traversal Guard** | Directory boundaries, symlink safety, relative path escapes | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent 2: Injection Guard** | Shell command quoting, no unsanitized child_process execution | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent 3: Academic Confidentiality Guard** | 100% offline, zero network exfiltration, zero external APIs | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent 4: ReDoS Analyzer** | Catastrophic regex backtracking prevention | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "| **Agent 5: Secret Leakage Guard** | Hardcoded tokens, credentials, private API keys | PASS |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> All automated security tests passed across all 5 review agents." >> $GITHUB_STEP_SUMMARY

      - name: Generate Failure Summary
        if: failure()
        run: |
          echo "## KalarisLabs Security Review Agents Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> One or more security review agents reported failures. Review the logs above." >> $GITHUB_STEP_SUMMARY
